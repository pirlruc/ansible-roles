# Authored backlog for this repository.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.3.0/github-issue-adr

milestones:
  - name: Continuous improvement
    epics:
      - id: AR-ROLE-001
        status: done
        title: Independent Docker and account roles
        overview:
          problem: >-
            Docker install, account creation, permission changes, and group
            membership were not separated, so one role would have to call the others.
          goal: >-
            Four roles with empty dependencies and one orchestrator playbook,
            tested on Ubuntu 26.04 and SLES 16.
        decision: >-
          In the context of host bootstrap that mixes packages and accounts, we
          decided separate roles plus playbooks/orchestrate.yml, to achieve
          independent reuse, accepting a second group_membership pass after Docker
          creates the docker group.
        architecture:
          target: roles and orchestrator
          modules:
            - roles/docker
            - roles/users
            - roles/permissions
            - roles/group_membership
            - playbooks/orchestrate.yml
        acceptance_criteria:
          - Each role lists dependencies as an empty list
          - Molecule covers ubuntu-26.04 and sles-16
          - CI reads docs/guardrails/ansible/profile.thresholds.yml
        guardrail_refs:
          - ANSIBLE-API-001
          - ANSIBLE-TEST-001
          - ANSIBLE-TEST-002
          - ANSIBLE-RUN-001
        tasks:
          - id: AR-ROLE-001-T1
            status: done
            title: Implement the four roles and the orchestrator
            instructions:
              files:
                - roles/docker/tasks/main.yml
                - roles/users/tasks/main.yml
                - roles/permissions/tasks/main.yml
                - roles/group_membership/tasks/main.yml
                - playbooks/orchestrate.yml
            verification:
              - python3 scripts/check-ansible-guardrails.py
              - ansible-lint
            guardrail_refs:
              - ANSIBLE-API-001
              - ANSIBLE-LINT-001

      - id: AR-ROLE-002
        status: open
        title: Add a docker_daemon role that merges daemon.json
        overview:
          problem: >-
            gpu-server writes the same NVIDIA runtime object over
            /etc/docker/daemon.json from both playbooks, which drops logging
            and any other runtimes. home-assistant does not write that file.
            Role docker installs the engine and must not also own daemon
            configuration. Supported hosts are Ubuntu 26.04 and SLES 16.
          goal: >-
            Role docker_daemon deep-merges a caller-supplied object into
            /etc/docker/daemon.json, restarts Docker when the file changes,
            lists no role dependencies, and has Molecule coverage on Ubuntu
            26.04 and SLES 16 with two converges. It accepts those two
            platforms only, the same gate as role docker.
        decision: >-
          In the context of NVIDIA daemon config duplicated beside the engine
          install, facing a role that must do one thing, we decided a separate
          docker_daemon role that merges JSON, to achieve one writer both GPU
          playbooks can call, accepting that a key removed from the fragment
          is not deleted from an existing file.
        out_of_scope:
          - Home Assistant adoption until that stack writes daemon.json
          - SLES 15. gpu-server moves that playbook to SLES 16 in GPU-SLES-001
          - NVIDIA driver and container toolkit tasks
          - Deleting daemon.json keys that the caller no longer sends
        architecture:
          target: roles/docker_daemon
          modules:
            - roles/docker_daemon
            - molecule/ubuntu-docker-daemon
            - molecule/sles-docker-daemon
        acceptance_criteria:
          - dependencies is an empty list and meta/argument_specs.yml documents the merge fragment
          - An existing daemon.json key that the fragment does not mention survives a converge
          - A fragment key overlays the same key already in the file
          - Molecule runs idempotence on ubuntu-26.04 and sles-16
          - The role does not install packages and refuses distributions other than Ubuntu 26.04 and SLES 16
        guardrail_refs:
          - ANSIBLE-API-001
          - ANSIBLE-API-002
          - ANSIBLE-TEST-001
          - ANSIBLE-TEST-002
          - ANSIBLE-DOC-001
        tasks:
          - id: AR-ROLE-002-T1
            status: open
            title: Implement docker_daemon with an empty dependency list
            instructions:
              files:
                - roles/docker_daemon/tasks/main.yml
                - roles/docker_daemon/defaults/main.yml
                - roles/docker_daemon/handlers/main.yml
                - roles/docker_daemon/meta/main.yml
                - roles/docker_daemon/meta/argument_specs.yml
                - roles/docker_daemon/README.md
            verification:
              - python3 scripts/check-ansible-guardrails.py
              - ansible-lint roles/docker_daemon
            guardrail_refs:
              - ANSIBLE-API-001
              - ANSIBLE-API-002
              - ANSIBLE-DOC-001
          - id: AR-ROLE-002-T2
            status: open
            title: Molecule-test the merge on Ubuntu 26.04 and SLES 16
            instructions:
              files:
                - molecule/ubuntu-docker-daemon/molecule.yml
                - molecule/sles-docker-daemon/molecule.yml
            verification:
              - molecule test -s ubuntu-docker-daemon
              - molecule test -s sles-docker-daemon
            guardrail_refs:
              - ANSIBLE-TEST-001
              - ANSIBLE-TEST-002

      - id: AR-CI-001
        status: open
        title: Call commondevops and containerdevops reusable workflows from CI
        overview:
          problem: >-
            .github/workflows/ci.yml inlines the toolchain install, the
            guardrail reader, yamllint, ansible-lint, and Molecule. It does not
            call common-doc-verify, common-infra-lint, common-secrets-sast, or
            containerdevops container-devcontainer. common-ansible-verify does
            not exist yet. Older issues in this repo ask for a workflow_call
            published here; org reusable workflows live in commondevops and
            containerdevops.
          goal: >-
            When COMMONDEVOPS_READ_TOKEN and CONTAINERDEVOPS_READ_TOKEN exist,
            ci.yml calls the workflows that already exist. When
            common-ansible-verify is on commondevops main, the inline
            ansible-lint, yamllint, and Molecule jobs are replaced by that
            call. Each scripts_ref equals that job's uses pin. Until then the
            inline workflow stays.
        decision: >-
          In the context of CI for this public role repository, facing private
          reusable workflows, we decided to call commondevops and
          containerdevops instead of publishing another workflow_call here, to
          achieve one job body per gate, accepting that the inline Molecule
          jobs remain until common-ansible-verify is on main and the caller
          tokens exist.
        description: >-
          Do not edit issues #1 through #25. Those issues stay as they are.
          This epic is the later decision for where the workflow body lives.
        out_of_scope:
          - "Editing issues #1 through #25"
          - >-
            Replacing the inline ansible-lint and Molecule jobs before
            common-ansible-verify is on commondevops main
          - Sending Dockerfiles under molecule/ to container-devcontainer
          - Folding ansible-lint YAML rules into common-doc-verify
        architecture:
          target: .github/workflows/ci.yml
          modules:
            - .github/workflows/ci.yml
        acceptance_criteria:
          - ci.yml calls common-doc-verify, common-infra-lint, and common-secrets-sast
          - ci.yml calls containerdevops container-devcontainer for .devcontainer/Dockerfile only
          - >-
            After common-ansible-verify exists, ci.yml calls it for
            ubuntu-accounts, sles-accounts, ubuntu-docker, and sles-docker
          - Every scripts_ref equals the uses pin on that job
          - The inline jobs remain on main until that reusable workflow exists
        guardrail_refs:
          - CI-034
          - CI-008
          - ANSIBLE-LINT-001
          - ANSIBLE-LINT-002
          - ANSIBLE-TEST-001
        tasks:
          - id: AR-CI-001-T1
            status: open
            title: Call the reusable workflows that already exist
            instructions:
              files:
                - .github/workflows/ci.yml
            verification:
              - >-
                rg -n 'common-doc-verify|common-infra-lint|common-secrets-sast|container-devcontainer'
                .github/workflows/ci.yml
              - rg -n 'molecule test' .github/workflows/ci.yml
            guardrail_refs:
              - CI-034
          - id: AR-CI-001-T2
            status: open
            title: Replace inline ansible-lint and Molecule with common-ansible-verify
            instructions:
              files:
                - .github/workflows/ci.yml
            verification:
              - rg -n 'common-ansible-verify' .github/workflows/ci.yml
              - The common-ansible-verify uses pin and its scripts_ref input are the same SHA
            guardrail_refs:
              - CI-034
              - ANSIBLE-LINT-001
              - ANSIBLE-TEST-001
