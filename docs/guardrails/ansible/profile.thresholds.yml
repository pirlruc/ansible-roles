# Org-default gates for Ansible role repositories.
# CI should read this file as the single source of truth for thresholds.
# Repos may override values with a recorded justification (Epic required when lowering a gate).

ansible_core_min: "2.17"          # ANSIBLE-LANG-002
ansible_lint_profile: production  # ANSIBLE-LINT-001
idempotence_runs: 2               # ANSIBLE-TEST-002
supported_platforms:              # ANSIBLE-RUN-001, ANSIBLE-TEST-001
  - ubuntu-26.04
  - sles-16
