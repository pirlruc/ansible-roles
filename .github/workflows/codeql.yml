name: codeql

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-codeql.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5 # v6.12.0
    with:
      languages: actions
