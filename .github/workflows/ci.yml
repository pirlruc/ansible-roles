# Dependabot github-actions ecosystem needs a workflow manifest.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Read ansible thresholds
        run: python3 scripts/check-ansible-guardrails.py

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check the orchestrator
        run: ansible-playbook --syntax-check playbooks/orchestrate.yml

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ubuntu-accounts
          - sles-accounts
          - ubuntu-docker
          - sles-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Molecule
        run: molecule test -s ${{ matrix.scenario }}
