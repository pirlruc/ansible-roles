# The lint job is token-free so Dependabot can merge (CI-024).
# Reusable jobs pass COMMONDEVOPS_READ_TOKEN and CONTAINERDEVOPS_READ_TOKEN.
# Those checkouts run only after GitHub loads the called workflow file.
# docs/guardrails is a private submodule. The thresholds job fetches it with
# GUARDRAILS_READ_TOKEN and is skipped for dependabot[bot].
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Submodule pins
        run: sh scripts/check-submodule-pins.sh

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check the orchestrator
        run: ansible-playbook --syntax-check playbooks/orchestrate.yml

  infra-lint:
    name: common-infra-lint
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      working_directory: .
      shell_scripts: scripts/*.sh .cursor/install.sh
      dockerfiles: >-
        .devcontainer/Dockerfile
        molecule/ubuntu-accounts/Dockerfile
        molecule/ubuntu-docker/Dockerfile
        molecule/sles-accounts/Dockerfile
        molecule/sles-docker/Dockerfile
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  docs:
    name: common-doc-verify
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      run_link_lint: true
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  secrets-sast:
    name: common-secrets-sast
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      working_directory: .
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  devcontainer:
    name: container-devcontainer
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-devcontainer.yml@2dd60d34418051fb0505f476d926b20550becfad
    with:
      blocking: true
      dockerfile: .devcontainer/Dockerfile
      scripts_ref: 2dd60d34418051fb0505f476d926b20550becfad
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  thresholds:
    name: Guardrail thresholds
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install lint tools
        run: sh scripts/install-lint-tools.sh

      - name: Init guardrails
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: sh scripts/ci-init-guardrails.sh

      - name: Read ansible thresholds
        run: python3 scripts/check-ansible-guardrails.py

      - name: Shell and Docker thresholds
        run: sh scripts/check-lint-thresholds.sh

  molecule:
    name: Molecule
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ubuntu-accounts
          - sles-accounts
          - ubuntu-docker
          - sles-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Molecule
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "${MOLECULE_SCENARIO}"
