# Token-free jobs are the Dependabot merge signal (CI-024).
# docs/guardrails is a private submodule. The thresholds job fetches it with
# GUARDRAILS_READ_TOKEN and is skipped for dependabot[bot].
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Submodule pins
        run: sh scripts/check-submodule-pins.sh

      - name: Install lint tools
        run: sh scripts/install-lint-tools.sh

      - name: Shellcheck
        run: shellcheck .cursor/install.sh scripts/*.sh

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: |
          python3 -m pip install 'zizmor==1.29.0'
          zizmor --offline .github/workflows

      - name: Markdown links
        run: python3 scripts/lint-doc-links.py

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check the orchestrator
        run: ansible-playbook --syntax-check playbooks/orchestrate.yml

  thresholds:
    name: Guardrail thresholds
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install lint tools
        run: sh scripts/install-lint-tools.sh

      - name: Init guardrails
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: sh scripts/ci-init-guardrails.sh

      - name: Read ansible thresholds
        run: python3 scripts/check-ansible-guardrails.py

      - name: Shell and Docker thresholds
        run: sh scripts/check-lint-thresholds.sh

  molecule:
    name: Molecule
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ubuntu-accounts
          - sles-accounts
          - ubuntu-docker
          - sles-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Molecule
        env:
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
        run: molecule test -s "${MOLECULE_SCENARIO}"
