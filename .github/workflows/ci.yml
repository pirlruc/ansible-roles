# Token-free Ansible job so Dependabot can merge (CI-024).
# common-ansible-verify installs from requirements.txt with --require-hashes
# and does not read a secret. The private guardrails submodule is checked
# only by the thresholds job, which is skipped for dependabot[bot].
# Container jobs use a public image. This repo has no pull token for the
# private ci-lint and ci-supply-chain packages.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible:
    name: common-ansible-verify
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-ansible-verify.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      scenarios: |
        ubuntu-accounts
        sles-accounts
        ubuntu-docker
        sles-docker
        ubuntu-docker-daemon
        sles-docker-daemon
      playbooks: |
        playbooks/orchestrate.yml
      # The guardrail reader needs the private submodule. Thresholds runs it.
      check_script: ""
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9
      blocking: true

  infra-lint:
    name: common-infra-lint
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      blocking: true
      working_directory: .
      shell_scripts: scripts/*.sh .cursor/install.sh
      dockerfiles: >-
        .devcontainer/Dockerfile
        molecule/ubuntu-accounts/Dockerfile
        molecule/ubuntu-docker/Dockerfile
        molecule/sles-accounts/Dockerfile
        molecule/sles-docker/Dockerfile
        molecule/ubuntu-docker-daemon/Dockerfile
        molecule/sles-docker-daemon/Dockerfile
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9
      container_image: >-
        ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  docs:
    name: common-doc-verify
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      blocking: true
      run_link_lint: true
      run_markdownlint: false
      run_shfmt: false
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9

  secrets-sast:
    name: common-secrets-sast
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      blocking: true
      working_directory: .
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9
      container_image: >-
        ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  devcontainer:
    name: container-devcontainer
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-devcontainer.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      blocking: true
      dockerfile: .devcontainer/Dockerfile
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f

  pins:
    name: common-pins-verify
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      pin_script: scripts/check-submodule-pins.sh
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9

  scaffold:
    name: common-scaffold-verify
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    secrets:
      packs_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
    with:
      blocking: true
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9

  supply-chain:
    name: common-supply-chain
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      blocking: true
      upload_sarif: true
      working_directory: .
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9
      container_image: >-
        ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  scorecard:
    name: common-scorecard
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    with:
      blocking: true
      publish_results: true

  thresholds:
    name: Guardrail thresholds
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install toolchain
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Install lint tools
        run: sh scripts/install-lint-tools.sh

      - name: Init guardrails
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: sh scripts/ci-init-guardrails.sh

      - name: Read ansible thresholds
        run: python3 scripts/check-ansible-guardrails.py

      - name: Shell and Docker thresholds
        run: sh scripts/check-lint-thresholds.sh
