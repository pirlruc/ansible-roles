# Presence check for the guardrails read token. The public devops repos do not need a read token.
# Prints kind and HTTP status only. Does not print secret values.
name: token-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Token probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Actions secrets and private read
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          kind_of() {
            case "$1" in
              github_pat_*) printf 'fine-grained' ;;
              ghp_*) printf 'classic' ;;
              ghs_*) printf 'installation' ;;
              "") printf 'empty' ;;
              *) printf 'other' ;;
            esac
          }
          check() {
            name="$1"
            token="$2"
            repo="$3"
            required="$4"
            kind="$(kind_of "$token")"
            if [ -z "$token" ]; then
              echo "${name} empty in Actions repository secrets for ${repo}"
              if [ "$required" = "required" ]; then
                fail=1
              else
                echo "${name} is a Dependabot secret. Actions cannot read that store."
              fi
              return
            fi
            code="$(curl -sS -o /tmp/probe-body -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}")"
            echo "${name} ${kind} GET ${repo} HTTP ${code}"
            if [ "$code" != "200" ]; then
              fail=1
            fi
          }
          check GUARDRAILS_READ_TOKEN "$GUARDRAILS_READ_TOKEN" pirlruc/guardrails required
          rm -f /tmp/probe-body
          exit "$fail"
