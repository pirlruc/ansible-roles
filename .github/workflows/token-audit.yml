name: token-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@ee91ea75b6f60bc55ec5a95e1692865ee96485e9
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
    with:
      scripts_ref: ee91ea75b6f60bc55ec5a95e1692865ee96485e9
