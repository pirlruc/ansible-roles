name: release

on:
  push:
    tags: ["1.*"]

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@ff65e7efbb7eea67bd659f886db0adb399f3a3f5 # v6.12.0
    with:
      tag: ${{ github.ref_name }}
      attach_sbom: false
      sign: false
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
