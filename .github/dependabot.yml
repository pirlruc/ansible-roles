# SC-DEP-001/002/003. Cadence: docs/guardrails/supply-chain/profile.thresholds.yml
# (monthly, open-PR limit 5, no blocked semver level).
# Personal-account private git: Dependabot secret DEPENDABOT_GITHUB_TOKEN
# (Contents: Read on pirlruc/guardrails and pirlruc/github-scaffold).
# Actions secrets are not visible to Dependabot (SC-DEP-005).
# gitsubmodule stays outside the multi-ecosystem group so a registry
# failure cannot block the other ecosystems (SC-DEP-004).

version: 2

registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    registries:
      - github-private
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    registries:
      - github-private
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /molecule/ubuntu-accounts
      - /molecule/ubuntu-docker
      - /molecule/ubuntu-docker-daemon
      - /molecule/sles-accounts
      - /molecule/sles-docker
      - /molecule/sles-docker-daemon
    patterns: ["*"]
    # github-private is a git registry. Attaching it makes Dependabot
    # authenticate registry.suse.com with that token and fail.
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
