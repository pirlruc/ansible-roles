- name: Require Ubuntu 26.04 or SLES 16
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('26.04', '=='))
        or (ansible_facts['distribution'] == 'SLES' and ansible_facts['distribution_major_version'] | int == 16)
    fail_msg: >-
      docker_daemon supports Ubuntu 26.04 and SLES 16 only
      (found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}).

- name: Ensure the Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the current daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_current
  failed_when: false
  changed_when: false

- name: Merge the hardened daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ docker_daemon_merged | to_nice_json }}\n"
  vars:
    docker_daemon_existing: >-
      {{ (docker_daemon_current.content | b64decode | from_json)
         if (docker_daemon_current.content | default('') | length > 0)
         else {} }}
    docker_daemon_merged: "{{ docker_daemon_existing | combine(docker_daemon_required, recursive=True) }}"
  notify: Restart docker
