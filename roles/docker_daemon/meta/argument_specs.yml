---
argument_specs:
  main:
    short_description: Merge a hardened daemon.json into a Docker host.
    options:
      docker_daemon_manage_service:
        type: bool
        required: false
        description: Restart Docker after a daemon.json change. Set false when Docker is not installed.
      docker_daemon_required:
        type: dict
        required: false
        description: >-
          Keys merged into /etc/docker/daemon.json. The defaults set
          live-restore, no-new-privileges, and json-file log rotation.
          The role does not add a TCP listener.
