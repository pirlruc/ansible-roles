---
- name: Require the target group to already exist
  ansible.builtin.getent:
    database: group
    key: "{{ item.group }}"
    fail_key: true
  loop: "{{ group_membership_entries }}"
  loop_control:
    label: "{{ item.group }}"

- name: Require each member account to already exist
  ansible.builtin.getent:
    database: passwd
    key: "{{ member }}"
    fail_key: true
  loop: "{{ group_membership_entries | subelements('members') }}"
  loop_control:
    label: "{{ item.1 }}"
  vars:
    member: "{{ item.1 }}"

- name: Add existing users to an existing group
  ansible.builtin.user:
    name: "{{ item.1 }}"
    groups: "{{ item.0.group }}"
    append: true
  loop: "{{ group_membership_entries | subelements('members') }}"
  loop_control:
    label: "{{ item.1 }} -> {{ item.0.group }}"
  when: item.0.state | default('present') == 'present'

- name: Read group membership before removal
  ansible.builtin.getent:
    database: group
    key: "{{ item.0.group }}"
  loop: "{{ group_membership_entries | subelements('members') }}"
  loop_control:
    label: "{{ item.0.group }}"
  when: item.0.state | default('present') == 'absent'

- name: Remove users from an existing group
  ansible.builtin.command:
    argv:
      - gpasswd
      - -d
      - "{{ item.1 }}"
      - "{{ item.0.group }}"
  loop: "{{ group_membership_entries | subelements('members') }}"
  loop_control:
    label: "{{ item.1 }} - {{ item.0.group }}"
  when:
    - item.0.state | default('present') == 'absent'
    - item.1 in ((ansible_facts.getent_group[item.0.group] | last | default('')) | split(','))
  changed_when: true
  register: group_membership_remove
